<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add someone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tag.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600;700&family=DM+Mono:wght@500&display=swap">
<style>
body{margin:0}
.tn-in{width:100%;border:0;border-bottom:2px solid #0b0b0c;background:transparent;padding:2px 0 6px;color:#0b0b0c;font:800 40px/40px "Bricolage Grotesque",sans-serif;letter-spacing:-.045em;border-radius:0}
.tn-in::placeholder{color:rgba(11,11,12,.35)}
.tn-in--sm{font-size:26px;line-height:28px}
</style>
</helmet>
<div class="t" style="width: 390px; height: 844px; padding: 60px 16px 28px; gap: 16px">
<div class="t-top">
<a class="t-round" href="TagPeople.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<span class="t-mono">New tag</span>
<span style="width: 44px"></span>
</div>
<h1 class="t-display">Who is it for?</h1>
<div class="t-tag" style="--c: var(--tomato); gap: 18px; margin-top: 4px">
<label style="display: flex; flex-direction: column; gap: 4px"><span class="t-mono">Name</span><input id="tn-name" class="tn-in" value="Mara" placeholder="Name"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 4px"><span class="t-mono">Budget</span><input id="tn-budget" class="tn-in tn-in--sm" inputmode="decimal" value="€60" placeholder="€50"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span class="t-mono">Occasion</span><input id="tn-occ" class="tn-in tn-in--sm" value="Birthday" placeholder="Birthday"></label>
</div>
<span class="t-mono">Budget includes shipping</span>
</div>
<div>
<span class="t-mono t-mute" style="display: block; padding-bottom: 10px">Tag colour</span>
<div style="display: flex; gap: 12px">
<button type="button" aria-label="Tomato, selected" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #0b0b0c; background: #ff5a3c; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #0b0b0c"></button>
<button type="button" aria-label="Lemon" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #0b0b0c; background: #ffd23f"></button>
<button type="button" aria-label="Mint" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #0b0b0c; background: #7fd6a8"></button>
<button type="button" aria-label="Lilac" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #0b0b0c; background: #c9a7ff"></button>
<button type="button" aria-label="Sky" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #0b0b0c; background: #8fd3ff"></button>
</div>
</div>
<div class="t-bar">
<a class="t-btn" href="TagInput.dc.html">Next</a>
</div>
</div>
</x-dc>
